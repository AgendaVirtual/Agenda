services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    volumes:
      - nexo-pg:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://nexo:nexo@db:5432/nexo
      TZ: America/Recife
      AUTH_SECRET: segredo-de-desenvolvimento-trocar-em-producao
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3100:3000"

  frontend:
    build: ./frontend
    environment:
      PORT: 8080
      API_URL: http://backend:3000
    ports:
      - "8090:8080"
    depends_on:
      - backend

volumes:
  nexo-pg:
